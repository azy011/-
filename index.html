<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内隐联想实验试填</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css">
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <script src="config.js"></script>
  <script src="stimuli.js"></script>
  <style>
    body { background: #f5f7fb; color: #182238; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    .jspsych-display-element { font-size: 19px; }
    .jspsych-content { max-width: 850px; }
    .card { padding: 32px; border-radius: 18px; background: white; box-shadow: 0 12px 36px #26375316; line-height: 1.75; }
    h1, h2 { line-height: 1.25; }
    .hint { color: #64748b; font-size: 15px; }
    .word { font-size: 50px; font-weight: 750; letter-spacing: .08em; min-height: 82px; }
    #jspsych-html-button-response-btngroup { display: flex; justify-content: center; gap: 14px; margin-top: 24px; }
    .jspsych-html-button-response-button { flex: 1; max-width: 330px; margin: 0 !important; }
    .touch-choice { width: 100%; min-height: 68px; padding: 12px; border: 2px solid #254dd8; border-radius: 12px; background: white; color: #254dd8; font: 700 18px system-ui, "Microsoft YaHei", sans-serif; touch-action: manipulation; cursor: pointer; }
    .touch-choice:active { background: #e8edff; }
    .key-hints { display: flex; justify-content: center; gap: 14px; margin-top: 24px; }
    .key-hint { flex: 1; max-width: 330px; min-height: 68px; display: grid; place-items: center; border: 2px solid #254dd8; border-radius: 12px; color: #254dd8; font-weight: 700; }
    .wrong { color: #dc2626; }
    .right { color: #16a34a; }
    .saving { color: #92400e; }
    .button { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 9px; background: #254dd8; color: white; font: inherit; cursor: pointer; }
    kbd { margin: 0 3px; }
    @media (max-width: 600px) {
      .jspsych-content { width: 100%; }
      .card { padding: 22px 18px; margin: 12px; }
      .word { font-size: 42px; }
      .touch-choice { font-size: 16px; min-height: 72px; }
    }
  </style>
</head>
<body>
<script>
  // 试填版单一目标分类任务；三个类别的刺激词均从 stimuli.js 读取。
  const experimentId = window.DATAPIPE_EXPERIMENT_ID;
  if (!experimentId || experimentId === 'PASTE_DATAPIPE_ID_HERE') {
    document.body.innerHTML = '<main class="card" style="max-width:680px;margin:8vh auto"><h1>尚未配置 DataPipe</h1><p>请先把 DataPipe 控制台中的实验 ID 填入 config.js，再发布此网页。</p></main>';
    throw new Error('DataPipe experiment ID is missing');
  }
  const participantId = crypto.randomUUID();
  const touchMode = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  const material = window.EXPERIMENT_STIMULI || {};
  const targetLabel = material.targetLabel || '慢传统';
  const words = {
    [targetLabel]: material.targetWords || [],
    积极: material.positiveWords || [],
    消极: material.negativeWords || []
  };
  if (targetLabel === '积极' || targetLabel === '消极' ||
      Object.values(words).some(list => !Array.isArray(list) || list.length < 4 ||
        list.some(word => typeof word !== 'string' || !word.trim()))) {
    document.body.innerHTML = '<main class="card" style="max-width:680px;margin:8vh auto"><h1>刺激词尚未配置完整</h1><p>请在 stimuli.js 中为目标类别、积极和消极各填写至少 4 个词，再发布实验。</p></main>';
    throw new Error('Stimulus lists are incomplete');
  }
  const jsPsych = initJsPsych({
    on_finish: showResults,
    extensions: [{
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: experimentId,
        filename: () => `iat_trial_${participantId}.csv`,
        data_string: exportTrialsCsv,
        on_save: result => {
          const status = document.getElementById('save-status');
          if (!status) return;
          if (result.ok) {
            status.className = 'right';
            status.textContent = '数据已提交成功，可以关闭页面。';
          } else {
            status.className = 'wrong';
            status.textContent = '自动提交失败。请点击下方按钮下载 CSV，并将文件发给研究者。';
          }
        }
      }
    }]
  });
  jsPsych.data.addProperties({ participant_id: participantId, experiment_version: 'pilot-10', input_mode: touchMode ? 'touch' : 'keyboard' });
  const timeline = [];
  const categories = Object.keys(words);

  function instruction(title, left, right, note) {
    return {
      type: touchMode ? jsPsychHtmlButtonResponse : jsPsychHtmlKeyboardResponse,
      stimulus: `<div class="card"><h2>${title}</h2><p>请尽量又快又准确地判断屏幕中央的词。</p><p>左侧 = ${left}　　右侧 = ${right}</p><p class="hint">${note}</p>${touchMode ? '' : '<p>按空格开始</p>'}</div>`,
      choices: touchMode ? ['开始'] : [' '],
      ...(touchMode ? { button_html: choice => `<button class="touch-choice">${choice}</button>` } : {})
    };
  }

  function addBlock(name, phase, condition, mapping, pairedCategoryCount) {
    const left = Object.entries(mapping).filter(([, key]) => key === 'f').map(([cat]) => cat).join(' / ');
    const right = Object.entries(mapping).filter(([, key]) => key === 'j').map(([cat]) => cat).join(' / ');
    timeline.push(instruction(name, left, right, `${phase === 'practice' ? '练习阶段' : '正式阶段'}：请记住本轮左右两侧的类别。`));

    const items = jsPsych.randomization.shuffle(categories.flatMap(category => {
      const pool = jsPsych.randomization.shuffle(words[category]);
      const count = mapping[category] === 'j' ? pairedCategoryCount * 2 : pairedCategoryCount;
      return Array.from({ length: count }, (_, index) => ({
        category, word: pool[index % pool.length]
      }));
    }));
    for (const item of items) {
      timeline.push({
        type: touchMode ? jsPsychHtmlButtonResponse : jsPsychHtmlKeyboardResponse,
        stimulus: `<div class="word">${item.word}</div>${touchMode ? '' : '<div class="key-hints"><div class="key-hint">F（左）</div><div class="key-hint">J（右）</div></div>'}`,
        choices: touchMode ? ['F（左）', 'J（右）'] : ['f', 'j'],
        ...(touchMode ? { button_html: choice => `<button class="touch-choice">${choice}</button>` } : {}),
        data: {
          task: 'classification', phase, block: name, category: item.category,
          word: item.word, expected_key: mapping[item.category],
          condition
        },
        on_finish: data => {
          data.response_key = touchMode ? (Number(data.response) === 0 ? 'f' : 'j') : data.response;
          data.correct = data.response_key === data.expected_key;
        }
      });
    }
  }

  timeline.push({
    type: touchMode ? jsPsychHtmlButtonResponse : jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="card"><h1>内隐联想实验试填</h1><p>实验分为四部分，每部分分为练习和正式两个环节，每环节各有两组分类任务。请根据每部分屏幕上方的指导语判断。${touchMode ? '每次点击 F（左）或 J（右）回答。' : '每次只按 F（左）或 J（右）回答。'}</p><p>请尽量又快又准确地作答，不要中途切换窗口。中途退出时，已完成部分也可能保存。</p><p>本实验收集数据仅用于学术研究。实验结束后请耐心等待数据保存。</p><p>${touchMode ? '同意参与本次实验请点击下方按钮开始。' : '同意参与本次实验请按空格开始。'}</p></div>`,
    choices: touchMode ? ['同意并开始'] : [' '],
    ...(touchMode ? { button_html: choice => `<button class="touch-choice">${choice}</button>` } : {})
  });

  const positiveMapping = { [targetLabel]: 'f', 积极: 'f', 消极: 'j' };
  const negativeMapping = { [targetLabel]: 'f', 消极: 'f', 积极: 'j' };
  addBlock('练习第一组', 'practice', 'target_positive', positiveMapping, 4);
  addBlock('练习第二组', 'practice', 'target_negative', negativeMapping, 4);
  addBlock('正式第一组', 'formal', 'target_positive', positiveMapping, 8);
  addBlock('正式第二组', 'formal', 'target_negative', negativeMapping, 8);

  function summarizeTrials(rows) {
    const formal = rows.filter(row => row.phase === 'formal');
    const correct = formal.filter(row => row.correct);
    const mean = arr => arr.length ? Math.round(arr.reduce((sum, row) => sum + row.rt, 0) / arr.length) : null;
    const positive = mean(correct.filter(row => row.condition === 'target_positive'));
    const negative = mean(correct.filter(row => row.condition === 'target_negative'));
    const accuracy = formal.length ? Math.round(1000 * correct.length / formal.length) / 10 : null;
    const groupAccuracy = condition => {
      const group = formal.filter(row => row.condition === condition);
      return group.length ? Math.round(1000 * group.filter(row => row.correct).length / group.length) / 10 : null;
    };
    const firstGroupAccuracy = groupAccuracy('target_positive');
    const secondGroupAccuracy = groupAccuracy('target_negative');
    const delta = positive !== null && negative !== null ? negative - positive : null;
    return { accuracy, firstGroupAccuracy, secondGroupAccuracy, positive, negative, delta };
  }

  function exportTrialsCsv() {
    const rows = jsPsych.data.get().filter({ task: 'classification', phase: 'formal' }).values();
    const summary = summarizeTrials(rows);
    const columns = [
      'participant_id', 'experiment_version', 'input_mode', 'phase', 'block', 'condition',
      'word', 'category', 'expected_key', 'response_key', 'correct', 'rt_ms',
      'group_accuracy_pct', 'formal_group_1_accuracy_pct', 'formal_group_2_accuracy_pct'
    ];
    const escapeCsv = value => {
      if (value === null || value === undefined) return '';
      const text = String(value);
      return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    };
    const records = rows.map(row => [
      row.participant_id, row.experiment_version, row.input_mode,
      row.phase, row.block, row.condition, row.word, row.category, row.expected_key, row.response_key,
      row.correct ? 1 : 0, row.rt,
      row.condition === 'target_positive' ? summary.firstGroupAccuracy : summary.secondGroupAccuracy,
      summary.firstGroupAccuracy, summary.secondGroupAccuracy
    ]);
    return '\uFEFF' + [columns, ...records].map(record => record.map(escapeCsv).join(',')).join('\r\n');
  }

  function showResults() {
    const rows = jsPsych.data.get().filter({ task: 'classification' }).values();
    const { firstGroupAccuracy, secondGroupAccuracy, positive, negative, delta } = summarizeTrials(rows);
    document.body.innerHTML = `<main class="card" style="max-width:680px;margin:8vh auto;text-align:center">
      <h1>已完成作答</h1>
      <p id="save-status" class="saving">正在提交数据，请暂时不要关闭页面……</p>
      <p>正式第一组正确率：<strong>${firstGroupAccuracy}%</strong></p>
      <p>正式第二组正确率：<strong>${secondGroupAccuracy}%</strong></p>
      <p>“${targetLabel} + 积极”平均正确反应时：<strong>${positive ?? '无'} ms</strong></p>
      <p>“${targetLabel} + 消极”平均正确反应时：<strong>${negative ?? '无'} ms</strong></p>
      <p>反应时差（后一组 − 前一组）：<strong>${delta ?? '无'} ms</strong></p>
      <p class="hint">这里只是描述性结果。题量很少，且没有采用正式 IAT 的计分与质量控制流程，不能据此推断稳定的内隐态度。</p>
      <button class="button" id="download">下载 Excel 可打开的 CSV</button>
    </main>`;
    document.getElementById('download').addEventListener('click', () => {
      const csv = exportTrialsCsv();
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `iat_trial_${participantId}.csv`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  }

  jsPsych.run(timeline);
</script>
</body>
</html>
